apiVersion: template.openshift.io/v1
kind: Template
metadata:
  annotations:
    defaults.template.kubevirt.io/disk: rootdisk
    description: Template for Red Hat Enterprise Linux 9 VM or newer. A PVC with the
      RHEL disk image must be available.
    iconClass: icon-rhel
    name.os.template.kubevirt.io/rhel9.0: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.1: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.2: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.3: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.4: Red Hat Enterprise Linux 9.0 or higher
    name.os.template.kubevirt.io/rhel9.5: Red Hat Enterprise Linux 9.0 or higher
    openshift.io/display-name: disorurl
    openshift.io/documentation-url: https://github.com/kubevirt/common-templates
    openshift.io/provider-display-name: ''
    openshift.io/support-url: https://github.com/kubevirt/common-templates/issues
    openshift.kubevirt.io/pronounceable-suffix-for-name-expression: 'true'
    operator-sdk/primary-resource: openshift-cnv/ssp-kubevirt-hyperconverged
    operator-sdk/primary-resource-type: SSP.ssp.kubevirt.io
    tags: hidden,kubevirt,virtualmachine,linux,rhel
    template.kubevirt.io/containerdisks: 'registry.redhat.io/rhel9/rhel-guest-image

      '
    template.kubevirt.io/editable: '/objects[0].spec.template.spec.domain.cpu.sockets

      /objects[0].spec.template.spec.domain.cpu.cores

      /objects[0].spec.template.spec.domain.cpu.threads

      /objects[0].spec.template.spec.domain.memory.guest

      /objects[0].spec.template.spec.domain.devices.disks

      /objects[0].spec.template.spec.volumes

      /objects[0].spec.template.spec.networks

      '
    template.kubevirt.io/images: 'https://access.redhat.com/downloads/content/479/ver=/rhel---9/9.0/x86_64/product-software

      '
    template.kubevirt.io/provider: ''
    template.kubevirt.io/provider-support-level: Full
    template.kubevirt.io/provider-url: https://www.redhat.com
    template.kubevirt.io/version: v1alpha1
    template.openshift.io/bindable: 'false'
  labels:
    app.kubernetes.io/component: templating
    app.kubernetes.io/managed-by: ssp-operator
    app.kubernetes.io/name: custom-templates
    app.kubernetes.io/part-of: hyperconverged-cluster
    app.kubernetes.io/version: 4.18.11
    flavor.template.kubevirt.io/small: 'true'
    os.template.kubevirt.io/rhel9.0: 'true'
    os.template.kubevirt.io/rhel9.1: 'true'
    os.template.kubevirt.io/rhel9.2: 'true'
    os.template.kubevirt.io/rhel9.3: 'true'
    os.template.kubevirt.io/rhel9.4: 'true'
    os.template.kubevirt.io/rhel9.5: 'true'
    template.kubevirt.io/architecture: amd64
    template.kubevirt.io/type: vm
    template.kubevirt.io/version: v0.32.2
    vm.kubevirt.io/template: rhel9-server-small
    vm.kubevirt.io/template.namespace: openshift
    workload.template.kubevirt.io/server: 'true'
  name: disorurl
  namespace: ascifix
objects:
- apiVersion: kubevirt.io/v1
  kind: VirtualMachine
  metadata:
    annotations:
      vm.kubevirt.io/validations: "[\n  {\n    \"name\": \"minimal-required-memory\"\
        ,\n    \"path\": \"jsonpath::.spec.domain.memory.guest\",\n    \"rule\": \"\
        integer\",\n    \"message\": \"This VM requires more memory.\",\n    \"min\"\
        : 1610612736\n  }\n]\n"
    labels:
      app: ${NAME}
      kubevirt.io/dynamic-credentials-support: 'true'
      vm.kubevirt.io/template: disorurl
      vm.kubevirt.io/template.namespace: ascifix
      vm.kubevirt.io/template.revision: '1'
    name: ${NAME}
    namespace: ascifix
  spec:
    dataVolumeTemplates:
    - metadata:
        name: ${NAME}-rootdisk
      spec:
        source:
          http:
            url: http://utility.lab.example.com:8080/openshift4/images/rhel9-mariadb.qcow2
        storage:
          accessModes:
          - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
    runStrategy: Halted
    template:
      metadata:
        annotations:
          vm.kubevirt.io/flavor: small
          vm.kubevirt.io/os: rhel9
          vm.kubevirt.io/workload: server
        labels:
          kubevirt.io/domain: ${NAME}
          kubevirt.io/size: small
      spec:
        architecture: amd64
        domain:
          cpu:
            cores: 1
            sockets: 1
            threads: 1
          devices:
            disks:
            - disk:
                bus: virtio
              name: cloudinitdisk
            - disk:
                bus: virtio
              name: rootdisk
            interfaces:
            - masquerade: {}
              model: virtio
              name: default
            rng: {}
          features:
            smm:
              enabled: true
          firmware:
            bootloader:
              efi: {}
          memory:
            guest: 2Gi
        networks:
        - name: default
          pod: {}
        terminationGracePeriodSeconds: 180
        volumes:
        - name: rootdisk
          dataVolume:
            name: ${NAME}-rootdisk
        - cloudInitNoCloud:
            userData: "#cloud-config\nuser: ferni\npassword: Atnorth3\nchpasswd:\n\
              \  expire: false\nssh_authorized_keys:\n  - ssh-rsa \
              \ LabGradingKey\nyum_repos:\n  appstream:\n    name: Extra Packages\
              \ for Enterprise Linux - AppStream\n    baseurl: http://content.example.com/rhel9.5/x86_64/dvd/AppStream\n\
              \    enabled: true\n    gpgcheck: false\n  baseos:\n    name: Extra\
              \ Packages for Enterprise Linux - BaseOS\n    baseurl: http://content.example.com/rhel9.5/x86_64/dvd/BaseOS\n\
              \    enabled: true\n    gpgcheck: false\nruncmd:\n  - \"curl -o /var/www/html/index.php\
              \ http://utility.lab.example.com:8080/openshift4/images/index.php\"\n\
              \  - \"dnf install -y httpd php\"\n  - \"systemctl enable --now httpd\"\
              \n"
          name: cloudinitdisk
parameters:
- description: VM name
  from: rhel9-[a-z0-9]{16}
  generate: expression
  name: NAME
- description: Name of the DataSource to clone
  name: DATA_SOURCE_NAME
  value: rhel9
- description: Namespace of the DataSource
  name: DATA_SOURCE_NAMESPACE
  value: openshift-virtualization-os-images
- description: Randomized password for the cloud-init user cloud-user
  from: '[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}'
  generate: expression
  name: CLOUD_USER_PASSWORD
